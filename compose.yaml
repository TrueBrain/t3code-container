services:
  t3code:
    image: ghcr.io/truebrain/t3code-container:latest
    restart: unless-stopped
    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME:?set GITHUB_USERNAME}
      PUID: 1000
      PGID: 1000
    ports:
      - "3773:3773"
      - "2222:22"
    volumes:
      - ./home:/home
      - ./workspace:/workspace
    shm_size: 1gb
