name: Build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          load: true
          tags: t3code-container:test

      - name: Smoke test
        run: |
          user=${GITHUB_REPOSITORY_OWNER,,}
          docker run -d --name t3code --shm-size 1g \
            -e GITHUB_USERNAME="$GITHUB_REPOSITORY_OWNER" \
            -p 3773:3773 -p 2222:22 \
            t3code-container:test

          for _ in $(seq 120); do
            if curl -s -o /dev/null http://localhost:3773; then
              up=1
              break
            fi
            sleep 5
          done
          docker logs t3code
          [ -n "${up:-}" ]

          ssh-keyscan -p 2222 localhost | grep -q ssh-ed25519
          docker exec -u "$user" t3code bash -c '
            set -euo pipefail
            set -a; . /etc/environment; set +a
            claude --version
            t3 --version
            node --version
            go version
            cargo --version
            uv --version
            gh --version
            git config --global user.email
            jq -e .mcpServers.playwright ~/.claude.json
          '

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
